# Local inventory: Ansible runs INSIDE WSL2 Ubuntu and configures that same
# machine (connection: local). Add a `lab` host to target a remote Linux VM.
all:
  children:
    workstation:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    app_servers:
      hosts:
        localhost:
          ansible_connection: local
