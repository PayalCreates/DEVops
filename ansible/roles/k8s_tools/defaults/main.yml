k8s_tools_version_commands:
  kubectl: "kubectl version --client -o json 2>/dev/null | jq -r .clientVersion.gitVersion"
  kind: "kind version 2>/dev/null | awk '{print $2}'"
  helm: "helm version --template '{{ '{{' }}.Version{{ '}}' }}' 2>/dev/null"
  terraform: "terraform version -json 2>/dev/null | jq -r .terraform_version"
