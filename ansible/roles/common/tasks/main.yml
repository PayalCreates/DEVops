- name: Verify supported OS (Ubuntu/Debian, incl. WSL2)
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "This role supports Debian/Ubuntu (WSL2 Ubuntu recommended)."

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Python tooling used by the project
  ansible.builtin.apt:
    name: [python3-pip, python3-venv]
    state: present

- name: Ensure ~/.kube exists for the invoking user
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
    owner: "{{ lookup('env', 'USER') | default(omit, true) }}"
  become: false
