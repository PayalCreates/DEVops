# With Docker Desktop's WSL integration enabled, `docker` already exists inside
# WSL and this role only verifies it. On a plain Linux VM it installs Docker Engine.
- name: Check for an existing docker CLI
  ansible.builtin.command: docker version --format '{{ "{{" }}.Client.Version{{ "}}" }}'
  register: docker_cli
  changed_when: false
  failed_when: false

- name: Install Docker Engine from the official repository
  when: docker_cli.rc != 0
  block:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map[ansible_facts['architecture']] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

- name: Allow the invoking user to use Docker without sudo
  ansible.builtin.user:
    name: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    groups: docker
    append: true
  when: docker_cli.rc != 0

- name: Verify docker compose v2 is available
  ansible.builtin.command: docker compose version
  changed_when: false
