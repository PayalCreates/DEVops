# ===========================================================================
# DevSecOps360 — local platform (sized for an 8 GB laptop)
#
#   Core app (≈600 MB):        docker compose up -d --build
#   + monitoring (≈+700 MB):   docker compose --profile monitoring up -d
#   + load test UI:            docker compose --profile loadtest up -d locust
#
# App:        http://localhost:8080      API docs: http://localhost:8080/docs
# Grafana:    http://localhost:3000      Prometheus: http://localhost:9090
# ===========================================================================
name: devsecops360

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    <<: *hardening
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"] # needed by postgres init
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
    # No published port: the database is only reachable from the backend network.

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../docker/backend.Dockerfile
      args: { APP_VERSION: "1.0.0" }
    image: ${IMAGE_REGISTRY:-local}/devsecops360-backend:${IMAGE_TAG:-local}
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_COLOR: blue
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [data, web]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.75" }

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    image: ${IMAGE_REGISTRY:-local}/devsecops360-frontend:${IMAGE_TAG:-local}
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/etc/nginx/conf.d"]
    environment:
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }
    networks: [web]
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.25" }

  # ------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    <<: *hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    networks: [web, data]
    deploy: { resources: { limits: { memory: 256M } } }

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["monitoring"]
    <<: *hardening
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]
    networks: [web]
    deploy: { resources: { limits: { memory: 64M } } }

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["monitoring"]
    <<: *hardening
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks: [data]
    deploy: { resources: { limits: { memory: 48M } } }

  loki:
    image: grafana/loki:3.3.2
    profiles: ["monitoring"]
    <<: *hardening
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks: [web]
    deploy: { resources: { limits: { memory: 192M } } }

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./observability/loki/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    deploy: { resources: { limits: { memory: 128M } } }

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    <<: *hardening
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [web]
    deploy: { resources: { limits: { memory: 192M } } }

  # --------------------------------------------------------------- load test
  locust:
    image: locustio/locust:2.32.4
    profiles: ["loadtest"]
    command: -f /mnt/locust/locustfile.py --host http://frontend:8080
    volumes: ["./load-testing:/mnt/locust:ro"]
    ports: ["8089:8089"]
    networks: [web]

networks:
  web: {}
  data:
    internal: true   # no internet egress for the database tier

volumes:
  pgdata: {}
  promdata: {}
  lokidata: {}
  grafanadata: {}
