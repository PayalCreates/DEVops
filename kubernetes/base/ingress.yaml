# Traefik ingress (installed by Terraform: terraform/modules/platform-addons).
# *.localtest.me resolves to 127.0.0.1 publicly, so no hosts-file edits are needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops360
  annotations:
    # <namespace>-<middleware>@kubernetescrd ; namespace is patched per overlay
    traefik.ingress.kubernetes.io/router.middlewares: devsecops360-dev-security-headers@kubernetescrd,devsecops360-dev-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: devsecops360.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
spec:
  rateLimit:
    average: 50 # requests/second per client IP, shared across all replicas
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
