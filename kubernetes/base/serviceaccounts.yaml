# One ServiceAccount per workload; none of them need the Kubernetes API,
# so API tokens are NOT mounted (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
# Used by the CD pipeline / deploy scripts (needs the API, see rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
