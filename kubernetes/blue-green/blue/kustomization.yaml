apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -blue
labels:
  - pairs:
      devsecops360/color: blue
    includeSelectors: true
    includeTemplates: true
resources:
  - ../app
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: blue
