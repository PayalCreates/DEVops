# Slim kube-prometheus-stack for a laptop cluster (installed by Terraform when
# enable_monitoring = true). Grafana admin password is injected via set_sensitive.
fullnameOverride: monitoring

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 768Mi }
    # Pick up ServiceMonitors / PrometheusRules from every namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
  grafana.ini:
    users: { allow_sign_up: false }
    analytics: { reporting_enabled: false, check_for_updates: false }

# Components that don't exist / aren't reachable on kind
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
