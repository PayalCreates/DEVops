# Grafana Alloy DaemonSet: tail pod logs of the devsecops360 namespaces → Loki.
alloy:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 160Mi }
  mounts:
    varlog: true
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["devsecops360-dev", "devsecops360-staging", "devsecops360-prod"]
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_devsecops360_color"]
          target_label  = "color"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.app.receiver]
      }

      loki.process "app" {
        stage.match {
          selector = "{service=\"backend\"}"
          stage.json {
            expressions = { level = "level", request_id = "request_id", route = "route" }
          }
          stage.labels {
            values = { level = "" }
          }
          stage.structured_metadata {
            values = { request_id = "", route = "" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
