# App-level monitoring objects for kube-prometheus-stack (CRDs must be installed):
#   kubectl apply -k observability/kubernetes/app-monitoring
# The same alert/SLO rules and dashboard as the Compose stack — one source of truth.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - podmonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: devsecops360-dashboard
    files:
      - devsecops360-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
