# GENERATED by scripts/generate_observability.py from observability/prometheus/rules/ — do not edit
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devsecops360
  labels:
    release: monitoring
spec:
  groups:
  - name: devsecops360-slo-burn
    rules:
    - alert: ErrorBudgetFastBurn
      expr: sli:error_ratio:rate1h > (14.4 * 0.005) and sli:error_ratio:rate5m > (14.4 * 0.005)
      for: 2m
      labels:
        severity: critical
        team: platform
      annotations:
        summary: Error budget burning fast ({{ $value | humanizePercentage }} errors)
        description: At this rate the 30-day error budget is gone in ~2 days.
        runbook_url: docs/runbooks/high-error-rate.md
    - alert: ErrorBudgetSlowBurn
      expr: sli:error_ratio:rate6h > (6 * 0.005) and sli:error_ratio:rate30m > (6 * 0.005)
      for: 15m
      labels:
        severity: warning
        team: platform
      annotations:
        summary: Error budget burning steadily
        runbook_url: docs/runbooks/high-error-rate.md
  - name: devsecops360-symptoms
    rules:
    - alert: BackendDown
      expr: up{job="backend"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Backend target {{ $labels.instance }} is down
        runbook_url: docs/runbooks/service-down.md
    - alert: HighLatencyP95
      expr: sli:latency_p95:5m > 0.3
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: p95 latency {{ $value | humanizeDuration }} exceeds 300 ms SLO
        runbook_url: docs/runbooks/high-latency.md
    - alert: HighErrorRate
      expr: sli:error_ratio:rate5m > 0.05 and sli:http_requests:rate5m > 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: More than 5% of requests are failing
        runbook_url: docs/runbooks/high-error-rate.md
    - alert: LoginBruteForceSuspected
      expr: sum(rate(auth_login_attempts_total{result=~"failure|rate_limited"}[5m])) > 1
      for: 5m
      labels:
        severity: warning
        team: security
      annotations:
        summary: "Sustained failed logins ({{ $value }}/s) \u2014 possible credential stuffing"
        runbook_url: docs/runbooks/security-incident.md
  - name: devsecops360-database
    rules:
    - alert: PostgresDown
      expr: pg_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: PostgreSQL is unreachable
        runbook_url: docs/runbooks/database-outage.md
    - alert: PostgresTooManyConnections
      expr: sum(pg_stat_database_numbackends) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL connections high ({{ $value }})
        runbook_url: docs/runbooks/database-outage.md
  - name: devsecops360-sli
    interval: 30s
    rules:
    - record: sli:http_requests:rate5m
      expr: sum(rate(http_requests_total{route!~"/health.*|/metrics"}[5m]))
    - record: sli:http_errors:rate5m
      expr: sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[5m]))
    - record: sli:error_ratio:rate5m
      expr: sli:http_errors:rate5m / clamp_min(sli:http_requests:rate5m, 1e-9)
    - record: sli:error_ratio:rate30m
      expr: 'sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[30m]))

        / clamp_min(sum(rate(http_requests_total{route!~"/health.*|/metrics"}[30m])), 1e-9)

        '
    - record: sli:error_ratio:rate1h
      expr: 'sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[1h]))

        / clamp_min(sum(rate(http_requests_total{route!~"/health.*|/metrics"}[1h])), 1e-9)

        '
    - record: sli:error_ratio:rate6h
      expr: 'sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[6h]))

        / clamp_min(sum(rate(http_requests_total{route!~"/health.*|/metrics"}[6h])), 1e-9)

        '
    - record: sli:availability:ratio_rate5m
      expr: 1 - sli:error_ratio:rate5m
    - record: sli:latency_good_ratio:rate5m
      expr: 'sum(rate(http_request_duration_seconds_bucket{route!~"/health.*|/metrics",le="0.3"}[5m]))

        / clamp_min(sum(rate(http_request_duration_seconds_count{route!~"/health.*|/metrics"}[5m])), 1e-9)

        '
    - record: sli:latency_p95:5m
      expr: "histogram_quantile(0.95,\n  sum by (le) (rate(http_request_duration_seconds_bucket{route!~\"/health.*|/metrics\"\
        }[5m])))\n"
    - record: slo:error_budget_remaining:ratio30d
      expr: "1 - (\n  (sum(increase(http_requests_total{route!~\"/health.*|/metrics\",status=~\"5..\"}[30d]))\n    / clamp_min(sum(increase(http_requests_total{route!~\"\
        /health.*|/metrics\"}[30d])), 1))\n  / (1 - 0.995)\n)\n"
