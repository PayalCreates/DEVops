# SLO recording rules (see docs/sre/slos.md)
#   SLI availability = non-5xx requests / all requests
#   SLI latency      = requests faster than 300 ms / all requests
#   SLO targets      : 99.5% availability, 95% of requests < 300 ms (30-day window)
groups:
  - name: devsecops360-sli
    interval: 30s
    rules:
      - record: sli:http_requests:rate5m
        expr: sum(rate(http_requests_total{route!~"/health.*|/metrics"}[5m]))
      - record: sli:http_errors:rate5m
        expr: sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[5m]))

      # Error ratio over several windows — used by multi-window burn-rate alerts
      - record: sli:error_ratio:rate5m
        expr: sli:http_errors:rate5m / clamp_min(sli:http_requests:rate5m, 1e-9)
      - record: sli:error_ratio:rate30m
        expr: |
          sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[30m]))
          / clamp_min(sum(rate(http_requests_total{route!~"/health.*|/metrics"}[30m])), 1e-9)
      - record: sli:error_ratio:rate1h
        expr: |
          sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[1h]))
          / clamp_min(sum(rate(http_requests_total{route!~"/health.*|/metrics"}[1h])), 1e-9)
      - record: sli:error_ratio:rate6h
        expr: |
          sum(rate(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[6h]))
          / clamp_min(sum(rate(http_requests_total{route!~"/health.*|/metrics"}[6h])), 1e-9)

      - record: sli:availability:ratio_rate5m
        expr: 1 - sli:error_ratio:rate5m

      - record: sli:latency_good_ratio:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_bucket{route!~"/health.*|/metrics",le="0.3"}[5m]))
          / clamp_min(sum(rate(http_request_duration_seconds_count{route!~"/health.*|/metrics"}[5m])), 1e-9)

      - record: sli:latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route!~"/health.*|/metrics"}[5m])))

      # Remaining error budget over 30 days (1 = untouched, 0 = exhausted)
      - record: slo:error_budget_remaining:ratio30d
        expr: |
          1 - (
            (sum(increase(http_requests_total{route!~"/health.*|/metrics",status=~"5.."}[30d]))
              / clamp_min(sum(increase(http_requests_total{route!~"/health.*|/metrics"}[30d])), 1))
            / (1 - 0.995)
          )
