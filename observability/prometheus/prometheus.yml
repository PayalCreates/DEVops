# Prometheus configuration for the Docker Compose stack.
# (Kubernetes uses kube-prometheus-stack + ServiceMonitor; see observability/kubernetes/)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: devsecops360
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels: { service: backend }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
