# Alertmanager routing. Locally, alerts are visible at http://localhost:9093.
# To get notifications, uncomment a receiver and inject its secret at runtime
# (never commit webhook URLs).
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: oncall
      repeat_interval: 1h
    - matchers: [team="security"]
      receiver: security

receivers:
  - name: default
  - name: oncall
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack_webhook
    #     channel: "#devsecops360-alerts"
    #     send_resolved: true
  - name: security

inhibit_rules:
  # If the backend is down, don't also page for its error rate / latency.
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95|ErrorBudget.*"]
