[project]
name = "devsecops360-backend"
version = "1.0.0"
description = "DevSecOps360 Task Management API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"../../tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["migrations"]
